name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  source:
    name: Source archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package source
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          OUT="tuishou-ting-${TAG}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="${OUT}/" -o "dist/${OUT}-src.tar.gz" HEAD
          sha256sum "dist/${OUT}-src.tar.gz" > "dist/${OUT}-src.tar.gz.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tuishou-ting-${{ github.ref_name }}-source
          path: |
            dist/tuishou-ting-${{ github.ref_name }}-src.tar.gz
            dist/tuishou-ting-${{ github.ref_name }}-src.tar.gz.sha256

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename tuishou-ting-${GITHUB_REF_NAME}.cdx
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tuishou-ting-${{ github.ref_name }}-sbom
          path: tuishou-ting-${{ github.ref_name }}.cdx.json

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [source, sbom]
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" -D release
          find release -type f -mindepth 2 -maxdepth 2 -exec mv {} release/ \;
          find release -type d -empty -delete
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* --title "${GITHUB_REF_NAME}" --generate-notes
